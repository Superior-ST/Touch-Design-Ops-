function apprView(){const A=rows('approvals'),items=[...rows('designs').filter(d=>d.status==='Sent to client').map(r=>({k:'Design',tb:'designs',r})),...rows('quotes').filter(q=>q.status==='Sent').map(r=>({k:'Quotation',tb:'quotes',r}))],last=x=>A.filter(a=>a.ref===refKey(x.tb,x.r)).pop(),pend=items.filter(x=>!last(x));
 const card=x=>`<div class="card" style="margin-bottom:12px"><div class="row" style="border:0;padding:0"><div><b>${esc(x.r.title||x.r.no||x.k)}</b><div class="mut">${x.k} · ${esc(x.r.project||'')}${x.k==='Quotation'?' · '+esc(money2(qTot(x.r),x.r.currency)):x.r.version?' · '+esc(x.r.version):''}</div></div>${x.k==='Design'&&(x.r.files||[]).length?`<button class="b" data-fl="designs|${x.r.id}">View files</button>`:''}${x.k==='Quotation'?`<button class="b" data-qm="${x.r.id}">View quotation</button>`:''}</div>${x.r.brief?`<div style="margin:8px 0;white-space:pre-wrap">${esc(x.r.brief)}</div>`:''}<div class="tool" style="margin:8px 0 0"><button class="b p" data-ap="${x.k}|${x.r.id}|ok">${x.k==='Design'?'Approve':'Accept'}</button><button class="b" data-ap="${x.k}|${x.r.id}|no">${x.k==='Design'?'Request changes':'Decline'}</button></div></div>`;

function decide(sv){const[kind,id,v]=sv.split('|'),tb=kind==='Design'?'designs':'quotes',src=rows(tb).find(x=>x.id===id);if(!src)return;const dec=kind==='Design'?(v==='ok'?'Approved':'Changes requested'):(v==='ok'?'Accepted':'Declined');
 ask(dec+': '+(src.title||src.no||kind),[{n:'c',l:v==='ok'?'Comment (optional)':'What should change? (comment)'}],d=>{if(v==='no'&&!String(d.c||'').trim()){ask('Please add a short comment so the team knows why.',[],()=>decide(sv));return}
  tab('approvals').rows.push({id:rid(),date:iso(0),kind,title:src.title||src.no||'',project:src.project||'',decision:dec,comment:String(d.c||'').trim(),ref:refKey(tb,src)});save();render()})}

function pidOf(t,r,P){P=P||pOpts();if(t==='projects')return r.id;if(t==='co')return r.pid||null;const v=t==='assessments'?r.pid:r.project,p=v&&P.find(x=>x.code===v||x.name===v);return p?p.id:null}
const recOf=(t,r,P)=>{const{id,...d}=r;return{id,tab:t,project_id:pidOf(t,r,P),data:d}};
function snapAll(){const m=new Map(),P=pOpts();S.tabs.forEach(t=>t.rows.forEach(r=>m.set(r.id,recOf(t.id,r,P))));S.co.forEach(r=>m.set(r.id,recOf('co',r,P)));return m}
function queue(){if(!READY)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(push,500);setSt('Unsaved…')}
async function push(){SYNC.t=null;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;
 try{const cur=snapAll(),up=[],del=[];cur.forEach((v,k)=>{if(SYNC.snap.get(k)!==JSON.stringify(v))up.push(v)});SYNC.snap.forEach((v,k)=>{if(!cur.has(k))del.push(k)});
  if(up.length||del.length){setSt('Saving…');let err=null;
   for(let i=0;i<up.length&&!err;i+=200)err=(await sb.from('records').upsert(up.slice(i,i+200),{onConflict:'id'})).error;
   for(let i=0;i<del.length&&!err;i+=200)err=(await sb.from('records').delete().in('id',del.slice(i,i+200))).error;
   if(err){await loadAll();render();setSt('⚠ Not saved');ask('Your last change was not saved and has been undone. Either you do not have permission for it, or the project code does not match a project assigned to you. ('+err.message+')',[],()=>{})}
   else{const nw=new Date().toISOString();up.forEach(v=>{const m=META[v.id]||(META[v.id]={by:ME.id,at:nw});m.ub=ME.id;m.uat=nw});cur.forEach((v,k)=>SYNC.snap.set(k,JSON.stringify(v)));[...SYNC.snap.keys()].forEach(k=>{if(!cur.has(k))SYNC.snap.delete(k)});setSt('✓ Saved')}}
  else setSt('✓ Saved')}
 catch(e){setSt('⚠ Offline');ask('Could not reach the server, so your last change is not saved. Check your connection, then make the change again. ('+e.message+')',[],()=>{})}
 SYNC.busy=false;if(SYNC.again){SYNC.again=false;push()}}
async function loadAll(){S.tabs.forEach(t=>t.rows=[]);S.co=[];META={};const n=1000;for(let from=0;;from+=n){const{data,error}=await sb.from('records').select('id,tab,data,created_by,created_at,updated_by,updated_at').order('created_at').order('id').range(from,from+n-1);if(error)throw error;
  data.forEach(x=>{META[x.id]={by:x.created_by,at:x.created_at,ub:x.updated_by,uat:x.updated_at};const r={id:x.id,...x.data};if(x.tab==='co')S.co.push(r);else{const t=tab(x.tab);if(t)t.rows.push(r)}});if(data.length<n)break}
 const dr=await sb.from('directory').select('id,name,role');DIR={};(dr.data||[]).forEach(u=>DIR[u.id]=u);
 PN=[];if(!canR('projects')){const pn=await sb.from('project_names').select('id,code,name');PN=(pn.data||[]).filter(p=>p.code)}
 SYNC.snap=new Map();snapAll().forEach((v,k)=>SYNC.snap.set(k,JSON.stringify(v)))}
const pOpts=()=>{const P=rows('projects').filter(p=>p.code).map(p=>({id:p.id,code:p.code,name:p.name||''}));return P.length||!CLOUD?P:PN};
const whoStr=id=>{const m=META[id];if(!m)return ME?(ME.full_name||ME.email)+' · now':'';const n=u=>(DIR[u]||{}).name||'Unknown',d=x=>{const t=x?new Date(x):null;return t&&!isNaN(t)?t.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''};return n(m.by)+' · '+d(m.at)+(m.ub&&m.ub!==m.by?` (edited by ${n(m.ub)} ${d(m.uat)})`:'')};
function authUI(msg){const m=$('#m');m.className='on';m.innerHTML=`<form class="box" id="lf"><img src="${ABOUT_IMG.logo}" alt="Touch Designs" style="height:44px;align-self:flex-start;border-radius:4px"><span class="mut">${esc(COMPANY.tag)}</span><span class="mut">Sign in with your work account.</span><input name="e" type="email" placeholder="Email" autocomplete="username" required><input name="p" type="password" placeholder="Password" autocomplete="current-password" required><span id="le" style="color:var(--bad)">${esc(msg||'')}</span><button class="b p">Sign in</button></form>`;

async function boot(){['#rs','#rt'].forEach(q=>{const e=$(q);if(e)e.style.display='none'});

async function start(){try{const{data:{user}}=await sb.auth.getUser(),{data:p,error:e1}=await sb.from('profiles').select('*').eq('id',user.id).single();if(e1)throw e1;ME=p;PERM={};
  if(p.active&&p.role!=='pending'){const{data:rp,error:e2}=await sb.from('role_perms').select('*').eq('role',p.role);if(e2)throw e2;rp.forEach(x=>PERM[x.tab]={r:x.can_read,w:x.can_write})}
  S.tabs.forEach(t=>{if(!t.cols.some(x=>x.t==='who'))t.cols.push({k:'_who',l:'Entered by',t:'who'})});await loadAll();READY=true;const LD={procurement:'requirements',designer:'designs',workforce:'jobs',site_manager:'jobs',client:'projects'}[ME.role];if(LD&&canR(LD))ui.tab=LD;$('#who').innerHTML=`${esc(ME.full_name||ME.email)} · ${ROLES[ME.role]||esc(ME.role)} <button class="b" id="lo">Sign out</button>`;render()}

 m.querySelectorAll('[data-dr],[data-dc],[data-a],[data-wd],[data-wadd],[data-bulk],[data-ph],[data-pd]').forEach(el=>{let tb=ui.tab;if(el.dataset.wd)tb=el.dataset.wd.split('|')[0];else if(el.dataset.wadd)tb=el.dataset.wadd==='co'?'co':'finance';else if(el.dataset.bulk)tb='co';else if(el.dataset.ph||el.dataset.pd)tb='production';

async function importBackup(file){const r=new FileReader();r.onload=()=>{let d;try{const j=JSON.parse(r.result);d=j.data||j}catch(x){}
 if(!d||!Array.isArray(d.tabs))return ask('That is not a valid backup file.',[],()=>{});const keep=S.tabs.map(t=>t.id),P=(d.tabs.find(t=>t.id==='projects')||{rows:[]}).rows,out=[];
 d.tabs.forEach(t=>{if(keep.includes(t.id))(t.rows||[]).forEach(row=>out.push(recOf(t.id,{...row,id:row.id||rid()},P)))});(d.co||[]).forEach(row=>out.push(recOf('co',{...row,id:row.id||rid()},P)));
 ask(`Import ${out.length} rows into the shared system? Rows with the same id are updated. Photos are not included.`,[{n:'x',l:'',o:'Cancel|Yes, import'}],async a=>{if(a.x==='Cancel')return;setSt('Importing…');let err=null;
  for(let i=0;i<out.length&&!err;i+=200)err=(await sb.from('records').upsert(out.slice(i,i+200),{onConflict:'id'})).error;
  if(err)ask('Import stopped: '+err.message,[],()=>{});else{await loadAll();render();ask('Imported '+out.length+' rows.',[],()=>{})}setSt('')})};r.readAsText(file)}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let b;if(!CLOUD)return;

 else if(b=g('[data-tp]')){const u=TEAM.pr.find(x=>x.id===b.dataset.tp),P=[...rows('projects')].sort((a,b)=>by(a.name,b.name)),mine=new Set(TEAM.pm.filter(x=>x.user_id===u.id).map(x=>x.project_id)),m=$('#m');m.className='on';
